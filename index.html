<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>캐릭터 설정집</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@500;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
[hidden]{display:none!important}
img{max-width:100%}
.actions{display:flex;flex-wrap:wrap;gap:10px}
.opts{display:flex;flex-direction:column;gap:10px}
#dlgImport{width:min(520px,calc(100% - 24px))}
#impWarn{color:var(--danger);font-size:14px}
/* Layout: 설정집 바인더. 왼쪽에 카테고리 목차, 오른쪽에 프로필 카드 그리드. 좁은 화면에서는 목차가 가로 칩 줄로 바뀜. 카드 클릭 시 상세 시트가 열림. */
:root{
  --bg:#EDEFF5;
  --surface:#F8F9FC;
  --ink:#1A1D33;
  --muted:#5C6283;
  --line:#D3D8E8;
  --accent:#4B44C2;
  --accent-ink:#FFFFFF;
  --danger:#B3304A;
  --scrim:rgba(18,20,36,.55);
  --fill-a:#CBD0EA;
  --fill-b:#E4E7F4;
  --font-display:"Hahmlet","Noto Serif KR",serif;
  --font-body:"IBM Plex Sans KR","Noto Sans KR",system-ui,sans-serif;
  --font-mono:"IBM Plex Mono","IBM Plex Sans KR",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#10121E;--surface:#191C2D;--ink:#E7E9F6;--muted:#9A9FC0;--line:#2A2E48;--accent:#9591F7;--accent-ink:#14152A;--danger:#F0869B;--scrim:rgba(0,0,0,.66);--fill-a:#262A45;--fill-b:#1D2036;color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#10121E;--surface:#191C2D;--ink:#E7E9F6;--muted:#9A9FC0;--line:#2A2E48;--accent:#9591F7;--accent-ink:#14152A;--danger:#F0869B;--scrim:rgba(0,0,0,.66);--fill-a:#262A45;--fill-b:#1D2036;color-scheme:dark}

*,*::before,*::after{box-sizing:border-box}
h1,h2,h3,h4,p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font:400 15px/1.6 var(--font-body);
  padding-block:28px 64px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.dim{color:var(--muted)}
.wrap{max-width:1180px;margin-inline:auto;display:flex;flex-direction:column;gap:28px}

.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px}
.count{font:500 12px/1 var(--font-mono);letter-spacing:.08em;color:var(--muted)}
h1{font:700 clamp(26px,5vw,38px)/1.2 var(--font-display);text-wrap:balance;margin-top:10px}
.notice{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:10px 14px;color:var(--muted);font-size:13px}

#priv{margin-top:6px;font-size:13px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:9px 16px;font-weight:500;line-height:1.2}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 11px;font-size:13px}
.btn.danger{color:var(--danger)}
.btn.danger:hover{border-color:var(--danger)}
.btn.danger.solid{background:var(--danger);border-color:var(--danger);color:var(--accent-ink)}
.btn:disabled{opacity:.55;cursor:default}

.layout{display:grid;grid-template-columns:210px minmax(0,1fr);gap:32px;align-items:start}
.worlds{display:flex;flex-direction:column;gap:2px;position:sticky;top:16px;min-width:0}
.w-lab{font:500 12px/1 var(--font-mono);letter-spacing:.1em;color:var(--muted);padding:0 10px 10px}
.w-item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1px solid transparent;background:transparent;padding:9px 10px;border-radius:6px;color:var(--muted)}
.w-item:hover{color:var(--ink)}
.w-item[aria-current="true"]{background:var(--surface);border-color:var(--line);color:var(--ink);font-weight:600}
.w-item i{width:9px;height:9px;border-radius:50%;flex:none}
.w-item i.hollow{border:1.5px solid var(--muted)}
.w-item .n{margin-left:auto;font:500 12px var(--font-mono)}
.w-manage{margin-top:12px;text-align:left;border:0;background:transparent;color:var(--accent);padding:8px 10px;font-weight:500;border-radius:6px}
.w-manage:hover{text-decoration:underline}

.whead{display:flex;flex-direction:column;gap:6px;margin-bottom:20px;max-width:65ch}
.whead h2{font:700 24px/1.3 var(--font-display);display:flex;align-items:center;gap:10px}
.whead h2 i{width:12px;height:12px;border-radius:50%;flex:none}
.whead p{color:var(--muted)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.card{display:flex;flex-direction:column;text-align:left;padding:0;border:1px solid var(--line);background:var(--surface);border-radius:6px;overflow:hidden;min-width:0}
.card:hover{border-color:var(--accent)}
.pic{position:relative;aspect-ratio:4/5;max-width:100%;background:linear-gradient(160deg,var(--fill-a),var(--fill-b));overflow:hidden}
.pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.pic .ini{position:absolute;inset:0;display:grid;place-items:center;font:700 56px/1 var(--font-display);color:var(--muted);opacity:.55}
.pic .ini.sm{font:500 12px/1 var(--font-mono);letter-spacing:.1em}
.mini{position:absolute;right:8px;bottom:8px;width:54px;height:54px;border-radius:50%;background:color-mix(in srgb,var(--surface) 84%,transparent)}
.badge-ex{position:absolute;left:8px;top:8px;font:500 11px/1 var(--font-mono);letter-spacing:.08em;background:var(--ink);color:var(--bg);padding:4px 7px;border-radius:3px}
.meta{display:flex;flex-direction:column;gap:6px;padding:12px 12px 14px;min-width:0}
.wtag{display:inline-flex;align-items:center;gap:7px;font:500 12px/1.2 var(--font-body);color:var(--muted)}
.wtag i{width:8px;height:8px;border-radius:50%;flex:none}
.card h3{font:700 18px/1.3 var(--font-display);overflow-wrap:anywhere}
.kw{font-size:13px;color:var(--muted);overflow-wrap:anywhere}

.empty{display:flex;flex-direction:column;gap:12px;justify-content:center;align-items:flex-start;padding:8px 4px;grid-column:span 2;max-width:46ch}
.empty h2{font:700 22px/1.3 var(--font-display);text-wrap:balance}
.empty p{color:var(--muted)}
.empty.solo{grid-column:1/-1}

dialog{padding:0;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);width:min(960px,calc(100% - 24px));max-width:none;margin:auto;overflow:auto;max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog::backdrop{background:var(--scrim)}
#dlgWorlds{width:min(720px,calc(100% - 24px))}

.detail{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr)}
.d-pic .pic{aspect-ratio:4/5;border-radius:0}
.d-body{padding:24px;display:flex;flex-direction:column;gap:14px;min-width:0}
.d-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.d-name{font:700 clamp(26px,4vw,34px)/1.25 var(--font-display);overflow-wrap:anywhere;text-wrap:balance}
.kws{display:flex;flex-wrap:wrap;gap:6px}
.k{border:1px solid var(--line);border-radius:4px;padding:3px 9px;font-size:13px;color:var(--ink)}
.lab{font:500 12px/1 var(--font-mono);letter-spacing:.1em;color:var(--muted);border-top:1px solid var(--line);padding-top:14px;margin-top:6px}
.bio{white-space:pre-wrap;overflow-wrap:anywhere;max-width:65ch}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:14px;margin:0}
.facts div{display:flex;flex-direction:column;gap:2px;min-width:0}
.facts dt{font:500 12px/1.4 var(--font-mono);letter-spacing:.06em;color:var(--muted)}
.facts dd{margin:0;font-weight:500;overflow-wrap:anywhere}
.radar{display:block;width:100%;max-width:420px;height:auto;margin-inline:auto}
.radar.is-mini{max-width:none;height:100%}
.r-ring{fill:none;stroke:var(--line);stroke-width:1}
.r-ax{stroke:var(--line);stroke-width:1;fill:none}
.r-area{fill:var(--accent);fill-opacity:.2;stroke:var(--accent);stroke-width:2;stroke-linejoin:round}
.is-mini .r-area{stroke-width:3}
.r-dot{fill:var(--accent)}
.r-l{font:500 13px var(--font-body);fill:var(--ink)}
.r-v{font:500 12px var(--font-mono);fill:var(--accent)}
.song{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;border:1px solid var(--line);border-radius:6px;padding:12px 14px}
.song div{display:flex;flex-direction:column;min-width:0}
.song strong{font:700 17px/1.3 var(--font-display);overflow-wrap:anywhere}
.song span{color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.d-actions{display:flex;flex-wrap:wrap;align-items:center;gap:10px;border-top:1px solid var(--line);padding-top:16px;margin-top:6px}
.d-actions .ask{color:var(--muted);font-size:14px;margin-right:auto}

.form{padding:22px;display:flex;flex-direction:column;gap:20px}
.form h2{font:700 22px/1.3 var(--font-display)}
.f-grid{display:grid;grid-template-columns:200px minmax(0,1fr);gap:20px}
.f-pic{display:flex;flex-direction:column;gap:10px;min-width:0}
.f-pic .pic{border-radius:6px;border:1px solid var(--line)}
.f-pic input[type=file]{font-size:13px;padding:6px}
.f-fields{display:flex;flex-direction:column;gap:14px;min-width:0}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>span,legend{font-size:13px;font-weight:600}
.field small{color:var(--muted);font-size:12px}
.cnt{align-self:flex-end;font:500 12px var(--font-mono);color:var(--muted)}
input[type=text],input[type=url],select,textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:9px 11px;min-width:0}
textarea{min-height:120px;resize:vertical}
textarea.short{min-height:84px}
.prof-f{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
fieldset{border:1px solid var(--line);border-radius:8px;padding:14px 16px 16px;margin:0;min-width:0;display:flex;flex-direction:column;gap:14px}
.shapes{display:flex;gap:18px;flex-wrap:wrap}
.shapes label{display:flex;align-items:center;gap:7px}
.stats{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:center}
#srows{display:flex;flex-direction:column;gap:10px}
.srow{display:grid;grid-template-columns:84px minmax(0,1fr) 26px;gap:10px;align-items:center}
.srow .sl{padding:6px 9px}
.srow output{font:500 13px var(--font-mono);text-align:right}
input[type=range]{accent-color:var(--accent);width:100%;margin:0}
.song-f{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.f-actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:flex-end}
.f-actions .sp{margin-right:auto}

.wrow{display:grid;grid-template-columns:auto minmax(0,1fr) minmax(0,2fr) auto;gap:10px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.sws{display:grid;grid-template-columns:repeat(4,22px);gap:6px}
.sw{width:22px;height:22px;border-radius:50%;border:2px solid transparent;padding:0}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--ink)}

.toast{position:fixed;inset:auto auto calc(16px + env(safe-area-inset-bottom,0px)) 50%;transform:translateX(-50%);margin:0;border:0;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:6px;max-width:calc(100% - 32px);font-size:14px}

@media (min-width:600px){.grid{grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:18px}}
@media (min-width:700px){
  .d-pic .pic{aspect-ratio:auto;height:100%;min-height:420px}
}
@media (max-width:859px){
  .layout{grid-template-columns:minmax(0,1fr);gap:20px}
  .worlds{flex-direction:row;overflow-x:auto;position:static;gap:8px;padding-bottom:6px;align-items:center}
  .w-lab{display:none}
  .w-item{width:auto;white-space:nowrap;border-color:var(--line);flex:none}
  .w-manage{margin-top:0;white-space:nowrap;flex:none}
}
@media (max-width:699px){
  .detail,.f-grid,.stats{grid-template-columns:minmax(0,1fr)}
  .song-f{grid-template-columns:minmax(0,1fr)}
  .f-pic{max-width:240px}
  .wrow{grid-template-columns:minmax(0,1fr)}
  .sws{grid-template-columns:repeat(8,22px)}
  .empty{grid-column:1/-1}
}
@media (prefers-reduced-motion:no-preference){
  .card .pic img{transition:transform .25s ease}
  .card:hover .pic img{transform:scale(1.03)}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <p class="count" id="count">CHARACTERS 0 · CATEGORIES 0</p>
      <h1>나의 캐릭터 설정집</h1>
      <p class="dim" id="priv" hidden>이 설정집은 나만 볼 수 있어요. 다른 사람과 공유되지 않아요.</p>
    </div>
    <div class="actions"><button type="button" class="btn" id="btnExport">백업 내보내기</button><button type="button" class="btn" id="btnImport">백업 불러오기</button><button type="button" class="btn primary" id="btnAdd" data-act="add">+ 캐릭터 추가</button></div>
    <input type="file" id="impFile" accept=".json,application/json" hidden aria-label="백업 파일 선택">
  </header>
  <p class="notice" id="notice" hidden></p>
  <div class="layout">
    <nav class="worlds" id="worlds" aria-label="카테고리"></nav>
    <main id="main"></main>
  </div>
</div>

<dialog id="dlgDetail" aria-label="캐릭터 상세"></dialog>

<dialog id="dlgEdit" aria-label="캐릭터 편집">
  <form class="form" id="editForm" autocomplete="off">
    <h2 id="editTitle">캐릭터 추가</h2>
    <div class="f-grid">
      <div class="f-pic">
        <div class="pic" id="picPrev"></div>
        <input type="file" id="picFile" accept="image/*" aria-label="이미지 파일 선택">
        <button type="button" class="btn ghost sm" id="picClear">이미지 지우기</button>
      </div>
      <div class="f-fields">
        <label class="field"><span>이름</span><input type="text" id="fName" maxlength="24" required></label>
        <label class="field"><span>카테고리</span><select id="fWorld"></select><small>카테고리는 메인 화면의 “카테고리 관리”에서 만들 수 있어요.</small></label>
        <label class="field"><span>키워드</span><input type="text" id="fKw" placeholder="예: 방랑 검사, 냉정함, 별빛 수집가"><small>쉼표로 구분하고 최대 5개까지 적어요.</small></label>
        <div class="prof-f">
          <label class="field"><span>나이</span><input type="text" id="fAge" maxlength="12" placeholder="예: 24세"></label>
          <label class="field"><span>성별</span><input type="text" id="fGender" maxlength="12" list="genderOpts" placeholder="예: 여성"><datalist id="genderOpts"><option value="여성"><option value="남성"><option value="논바이너리"><option value="불명"></datalist></label>
          <label class="field"><span>키</span><input type="text" id="fHeight" maxlength="12" placeholder="예: 168cm"></label>
          <label class="field"><span>몸무게</span><input type="text" id="fWeight" maxlength="12" placeholder="예: 54kg"></label>
        </div>
        <label class="field"><span>성격</span><textarea class="short" id="fPers" maxlength="150" placeholder="예: 말수가 적고 냉정해 보이지만 의리가 깊다."></textarea></label>
        <label class="field"><span>특징</span><textarea class="short" id="fTraits" maxlength="200" placeholder="외모, 버릇, 소지품, 배경 등 기억해 둘 점을 적어 보세요."></textarea></label>
      </div>
    </div>
    <fieldset>
      <legend>능력치</legend>
      <div class="stats">
        <div id="srows"></div>
        <div id="srPrev"></div>
      </div>
    </fieldset>
    <fieldset>
      <legend>테마곡</legend>
      <div class="song-f">
        <label class="field"><span>곡 제목</span><input type="text" id="fSongTitle" maxlength="60"></label>
        <label class="field"><span>아티스트</span><input type="text" id="fSongArtist" maxlength="60"></label>
        <label class="field"><span>듣기 링크</span><input type="url" id="fSongUrl" placeholder="https://" maxlength="300"></label>
      </div>
    </fieldset>
    <div class="f-actions">
      <button type="button" class="btn" data-act="close">취소</button>
      <button type="submit" class="btn primary" id="editSave">저장</button>
    </div>
  </form>
</dialog>

<dialog id="dlgWorlds" aria-label="카테고리 관리">
  <form class="form" id="worldsForm" autocomplete="off">
    <h2>카테고리 관리</h2>
    <p class="dim">카테고리마다 이름, 색, 짧은 설명을 정할 수 있어요. 삭제한 카테고리의 캐릭터는 미분류로 남아요.</p>
    <div id="wlist"></div>
    <div class="f-actions">
      <button type="button" class="btn" id="wAdd">+ 카테고리 추가</button>
      <span class="sp"></span>
      <button type="button" class="btn" data-act="close">취소</button>
      <button type="submit" class="btn primary">저장</button>
    </div>
  </form>
</dialog>

<dialog id="dlgImport" aria-label="백업 불러오기">
  <form class="form" id="importForm">
    <h2>백업 불러오기</h2>
    <p class="dim" id="impInfo"></p>
    <div class="opts" role="radiogroup" aria-label="불러오는 방식">
      <label class="shapes"><input type="radio" name="impMode" id="impMerge" value="merge" checked> 지금 데이터에 합치기 (같은 캐릭터는 파일 내용으로 바뀌어요)</label>
      <label class="shapes"><input type="radio" name="impMode" id="impReplace" value="replace"> 모두 지우고 파일 내용으로 바꾸기</label>
    </div>
    <p id="impWarn" hidden>현재 저장된 캐릭터와 카테고리가 모두 지워지고 되돌릴 수 없어요.</p>
    <div class="f-actions">
      <button type="button" class="btn" data-act="close">취소</button>
      <button type="submit" class="btn primary" id="impGo">불러오기</button>
    </div>
  </form>
</dialog>

<div class="toast" id="toast" popover="manual" role="status"></div>

<script>
(function(){
'use strict';
var $=function(s){return document.querySelector(s)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var clamp=function(n,a,b){return Math.min(b,Math.max(a,n))};
var okColor=function(c){return /^#[0-9a-fA-F]{6}$/.test(c||'')?c:'#8A8FA6'};
var okImg=function(s){return typeof s==='string'&&/^data:image\/(jpeg|png|webp);base64,/.test(s)};
var okUrl=function(s){return /^https?:\/\/\S+$/i.test(s||'')};
var newId=function(p){return p+Date.now().toString(36)+Math.random().toString(36).slice(2,6)};

var COLORS=['#E0526B','#E58A2E','#C9A227','#3FA672','#2F9AB5','#4F6FE0','#9A5BD6','#8A8FA6'];
var DEF=[['힘',5],['속도',5],['지능',5],['마력',5],['체력',5]];
var mkAxes=function(){return DEF.map(function(a){return {l:a[0],v:a[1]}})};
var LS='oc-archive-v1';
var SAVE_ERR='저장하지 못했어요. 브라우저 저장 공간이 부족하거나 이미지가 너무 클 수 있어요.';

var EXAMPLE_WORLD={id:'_ex',name:'예시 카테고리',color:'#4F6FE0',desc:''};
var EXAMPLE={id:'_ex',name:'세린 아르덴',worldId:'_ex',keywords:['방랑 검사','냉정함','별빛 수집가'],
  bio:'',age:'24세',gender:'여성',height:'168cm',weight:'54kg',
  personality:'말수가 적고 냉정해 보이지만, 한 번 한 약속은 반드시 지킨다.',
  traits:'북쪽 설원 마을 출신. 왼쪽 눈썹에 오래된 흉터가 있고, 사라진 스승의 검을 늘 등에 메고 다닌다.',
  shape:5,axes:[{l:'검술',v:9},{l:'속도',v:7},{l:'지능',v:6},{l:'마력',v:3},{l:'체력',v:8}],
  songTitle:'테마곡 제목',songArtist:'아티스트',songUrl:'',image:'',createdAt:0};

var S={worlds:[],chars:[],filter:'all',db:null,base:null,canWrite:true,local:false,editing:null,img:'',draft:[],removed:[],detail:null};

function normAxes(a){
  var base=mkAxes();
  if(Array.isArray(a)){for(var i=0;i<5;i++){if(a[i]&&typeof a[i]==='object'){base[i]={l:String(a[i].l==null?base[i].l:a[i].l).slice(0,6),v:clamp(Math.round(Number(a[i].v)||0),0,10)}}}}
  return base;
}
function norm(c){
  var o={name:'',worldId:'',keywords:[],bio:'',age:'',gender:'',height:'',weight:'',personality:'',traits:'',songTitle:'',songArtist:'',songUrl:'',image:'',createdAt:0};
  for(var k in c){o[k]=c[k]}
  o.shape=5;
  o.axes=normAxes(c.axes);
  o.keywords=Array.isArray(c.keywords)?c.keywords.map(String):[];
  return o;
}
var cmpW=function(a,b){return (a.order||0)-(b.order||0)||String(a.name).localeCompare(String(b.name))};
var cmpC=function(a,b){return (a.createdAt||0)-(b.createdAt||0)};
var worldOf=function(c){for(var i=0;i<S.worlds.length;i++){if(S.worlds[i].id===c.worldId)return S.worlds[i]}return null};

/* ---------- 저장소 ---------- */
function loadLocal(){try{var j=JSON.parse(localStorage.getItem(LS)||'null');if(j){S.worlds=(j.worlds||[]).sort(cmpW);S.chars=(j.chars||[]).map(norm).sort(cmpC)}}catch(e){}}
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify({worlds:S.worlds,chars:S.chars}));return true}catch(e){return false}}
var IDB=null;
function storeOf(kind){return kind==='worlds'?'worlds':'chars'}
function idbOpen(){return new Promise(function(res,rej){
  var r=indexedDB.open('oc-archive',1);
  r.onupgradeneeded=function(){var d=r.result;['worlds','chars'].forEach(function(n){if(!d.objectStoreNames.contains(n))d.createObjectStore(n,{keyPath:'id'})})};
  r.onsuccess=function(){res(r.result)};
  r.onerror=function(){rej(r.error)};
  r.onblocked=function(){rej(new Error('blocked'))};
})}
function idbRun(store,mode,fn){return new Promise(function(res,rej){
  var tx=IDB.transaction(store,mode),req=fn(tx.objectStore(store));
  tx.oncomplete=function(){res(req&&req.result)};
  tx.onerror=function(){rej(tx.error)};
  tx.onabort=function(){rej(tx.error||new Error('abort'))};
})}
async function persist(kind,obj){
  if(!IDB){if(!saveLocal())throw new Error('local');return}
  await idbRun(storeOf(kind),'readwrite',function(s){return s.put(obj)});
}
async function unpersist(kind,id){
  if(!IDB){saveLocal();return}
  await idbRun(storeOf(kind),'readwrite',function(s){return s.delete(id)});
}
async function initLocal(){
  try{IDB=await idbOpen()}catch(e){IDB=null}
  if(!IDB){loadLocal();return}
  S.worlds=((await idbRun('worlds','readonly',function(s){return s.getAll()}))||[]).sort(cmpW);
  S.chars=((await idbRun('chars','readonly',function(s){return s.getAll()}))||[]).map(norm).sort(cmpC);
  try{
    if(!S.worlds.length&&!S.chars.length&&!localStorage.getItem('oc-archive-migrated-v1')){
      loadLocal();
      for(var i=0;i<S.worlds.length;i++)await persist('worlds',S.worlds[i]);
      for(var j=0;j<S.chars.length;j++)await persist('characters',S.chars[j]);
      localStorage.setItem('oc-archive-migrated-v1','1');
    }
  }catch(e){}
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
}
async function put(kind,obj){
  if(S.db){var rest={};for(var k in obj){if(k!=='id')rest[k]=obj[k]}await S.base.collection(kind).doc(obj.id).set(rest);return}
  var arr=kind==='worlds'?S.worlds:S.chars;
  var i=arr.findIndex(function(x){return x.id===obj.id});
  if(i<0)arr.push(obj);else arr[i]=obj;
  arr.sort(kind==='worlds'?cmpW:cmpC);
  await persist(kind,obj);
  render();
}
async function del(kind,id){
  if(S.db){await S.base.collection(kind).doc(id).delete();return}
  if(kind==='worlds')S.worlds=S.worlds.filter(function(x){return x.id!==id});
  else S.chars=S.chars.filter(function(x){return x.id!==id});
  await unpersist(kind,id);render();
}

/* ---------- 작은 도구 ---------- */
var toastTimer=0;
function toast(msg){
  var t=$('#toast');t.textContent=msg;
  try{if(!t.matches(':popover-open'))t.showPopover()}catch(e){}
  clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){try{t.hidePopover()}catch(e){}},3600);
}
function openD(d){try{d.showModal()}catch(e){d.setAttribute('open','')}}
function closeD(d){try{d.close()}catch(e){d.removeAttribute('open')}}

/* ---------- 능력치 레이더 ---------- */
function radar(axes,n,mini,name){
  var W=mini?100:360,H=mini?100:290,cx=W/2,cy=mini?50:148,R=mini?36:94;
  var ang=function(i){return -Math.PI/2+i*2*Math.PI/n};
  var pt=function(i,r){return [cx+r*Math.cos(ang(i)),cy+r*Math.sin(ang(i))]};
  var f=function(v){return v.toFixed(1)};
  var poly=function(r){var p=[];for(var i=0;i<n;i++)p.push(pt(i,r).map(f).join(','));return p.join(' ')};
  var use=axes.slice(0,n);
  var vals=use.map(function(a){return clamp(Number(a.v)||0,0,10)});
  var s='';
  (mini?[.5,1]:[.2,.4,.6,.8,1]).forEach(function(k){s+='<polygon class="r-ring" points="'+poly(R*k)+'"/>'});
  if(!mini){for(var i=0;i<n;i++){var e=pt(i,R);s+='<line class="r-ax" x1="'+cx+'" y1="'+cy+'" x2="'+f(e[0])+'" y2="'+f(e[1])+'"/>'}}
  s+='<polygon class="r-area" points="'+vals.map(function(v,i){return pt(i,R*v/10).map(f).join(',')}).join(' ')+'"/>';
  if(!mini){
    vals.forEach(function(v,i){var p=pt(i,R*v/10);s+='<circle class="r-dot" cx="'+f(p[0])+'" cy="'+f(p[1])+'" r="3.2"/>'});
    use.forEach(function(a,i){
      var p=pt(i,R+14),c=Math.cos(ang(i)),sn=Math.sin(ang(i));
      var anchor=c>.3?'start':c<-.3?'end':'middle';
      var dy=sn>.3?'.8em':sn<-.3?'-.1em':'.35em';
      s+='<text class="r-l" x="'+f(p[0])+'" y="'+f(p[1])+'" dy="'+dy+'" text-anchor="'+anchor+'">'+esc(a.l)+'<tspan class="r-v" dx="5">'+vals[i]+'</tspan></text>';
    });
  }
  var label=(name?name+' ':'')+'능력치 '+use.map(function(a,i){return a.l+' '+vals[i]}).join(', ');
  return '<svg class="radar'+(mini?' is-mini':'')+'" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(label)+'">'+s+'</svg>';
}

function renderCount(){$('#count').textContent='CHARACTERS '+S.chars.length+' · CATEGORIES '+S.worlds.length}
function inWorld(c,id){return id==='all'||(id==='_none'?!worldOf(c):c.worldId===id)}
function renderNav(){
  if(S.filter!=='all'&&S.filter!=='_none'&&!S.worlds.some(function(w){return w.id===S.filter}))S.filter='all';
  var none=S.chars.filter(function(c){return !worldOf(c)}).length;
  var items=[{id:'all',name:'전체',color:null,n:S.chars.length}];
  S.worlds.forEach(function(w){items.push({id:w.id,name:w.name,color:w.color,n:S.chars.filter(function(c){return c.worldId===w.id}).length})});
  if(none&&S.worlds.length)items.push({id:'_none',name:'미분류',color:null,n:none});
  var h='<p class="w-lab">CATEGORIES</p>'+items.map(function(it){
    return '<button type="button" class="w-item" data-act="filter" data-id="'+esc(it.id)+'" aria-current="'+(S.filter===it.id)+'">'+
      (it.color?'<i style="background:'+okColor(it.color)+'"></i>':'<i class="hollow"></i>')+'<span>'+esc(it.name)+'</span><span class="n">'+it.n+'</span></button>';
  }).join('');
  if(S.canWrite)h+='<button type="button" class="w-manage" data-act="worlds">카테고리 관리</button>';
  $('#worlds').innerHTML=h;
}
function renderMain(){
  var h='',w=null;
  if(S.filter!=='all'&&S.filter!=='_none'){
    w=S.worlds.filter(function(x){return x.id===S.filter})[0]||null;
    if(w)h+='<section class="whead"><h2><i style="background:'+okColor(w.color)+'"></i>'+esc(w.name)+'</h2>'+(w.desc?'<p>'+esc(w.desc)+'</p>':'')+'</section>';
  }
  var list=S.chars.filter(function(c){return inWorld(c,S.filter)});
  if(!S.chars.length){
    h+='<div class="grid">'+cardHTML(EXAMPLE,true)+'<div class="empty"><h2>첫 캐릭터를 기록해 보세요</h2>'+
      '<p>이미지, 이름, 키워드, 프로필, 능력치, 테마곡을 한 장에 모아 둘 수 있어요. 왼쪽 카드는 예시예요.</p>'+
      (S.canWrite?'<button type="button" class="btn primary" data-act="add">캐릭터 추가</button>':'<p>아직 등록된 캐릭터가 없어요.</p>')+'</div></div>';
  }else if(!list.length){
    h+='<div class="grid"><div class="empty solo"><h2>이 카테고리에는 아직 캐릭터가 없어요</h2>'+(S.canWrite?'<button type="button" class="btn primary" data-act="add">캐릭터 추가</button>':'')+'</div></div>';
  }else{
    h+='<div class="grid">'+list.map(function(c){return cardHTML(c,false)}).join('')+'</div>';
  }
  $('#main').innerHTML=h;
}
function render(){
  renderCount();renderNav();renderMain();
  $('#btnAdd').hidden=!S.canWrite;
}

function parseKw(s){
  var out=[];
  s.split(/[,，、\n]/).forEach(function(x){x=x.trim().slice(0,16);if(x&&out.indexOf(x)<0)out.push(x)});
  return out.slice(0,5);
}
async function saveChar(){

  if(!name){toast('이름을 입력해 주세요.');$('#fName').focus();return}
  var url=$('#fSongUrl').value.trim();

  var base=S.editing?S.chars.filter(function(x){return x.id===S.editing})[0]:null;
  var now=Date.now();
  var obj={id:S.editing||newId('c'),name:name.slice(0,24),worldId:$('#fWorld').value,keywords:parseKw($('#fKw').value),
    bio:'',age:$('#fAge').value.trim().slice(0,12),gender:$('#fGender').value.trim().slice(0,12),height:$('#fHeight').value.trim().slice(0,12),weight:$('#fWeight').value.trim().slice(0,12),personality:$('#fPers').value.trim().slice(0,150),traits:$('#fTraits').value.trim().slice(0,200),shape:curShape(),axes:readAxes(),
    songTitle:$('#fSongTitle').value.trim(),songArtist:$('#fSongArtist').value.trim(),songUrl:url,
    image:S.img||'',createdAt:base?base.createdAt:now,updatedAt:now};
  var btn=$('#editSave');btn.disabled=true;
  try{
    await put('characters',obj);
    closeD($('#dlgEdit'));
    showDetail(norm(obj),false);
    toast('저장했어요.');
  }catch(e){toast(SAVE_ERR)}
  btn.disabled=false;
}
function fileToDataURL(file){
  return new Promise(function(res,rej){
    var fr=new FileReader();
    fr.onerror=function(){rej(new Error('read'))};
    fr.onload=function(){
      var im=new Image();
      im.onerror=function(){rej(new Error('load'))};
      im.onload=function(){
        try{
          var sizes=[1200,1000,800,640],qs=[.88,.78,.68];
          for(var a=0;a<sizes.length;a++){
            var k=Math.min(1,sizes[a]/Math.max(im.width,im.height));
            var w=Math.max(1,Math.round(im.width*k)),h=Math.max(1,Math.round(im.height*k));
            var c=document.createElement('canvas');c.width=w;c.height=h;
            var x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(im,0,0,w,h);
            for(var b=0;b<qs.length;b++){var d=c.toDataURL('image/jpeg',qs[b]);if(d.length<700000){res(d);return}}
          }
          rej(new Error('big'));
        }catch(e){rej(e)}
      };
      im.src=fr.result;
    };
    fr.readAsDataURL(file);
  });
}

async function saveWorlds(){
  if(S.draft.some(function(w){return !w.name.trim()})){toast('카테고리 이름을 입력해 주세요.');return}
  try{
    for(var i=0;i<S.removed.length;i++)await del('worlds',S.removed[i]);
    for(var j=0;j<S.draft.length;j++){
      var w=S.draft[j];
      await put('worlds',{id:w.id,name:w.name.trim().slice(0,24),color:w.color,desc:(w.desc||'').trim().slice(0,120),order:j});
    }
    closeD($('#dlgWorlds'));toast('카테고리을 저장했어요.');
  }catch(e){toast(SAVE_ERR)}
}

/* ---------- 이벤트 ---------- */
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-act]');
  if(t){
    var act=t.getAttribute('data-act'),id=t.getAttribute('data-id');
    if(act==='filter'){S.filter=id;render()}
    else if(act==='open'){var c=S.chars.filter(function(x){return x.id===id})[0];if(c)showDetail(c,false)}
    else if(act==='open-ex')showDetail(norm(EXAMPLE),true);
    else if(act==='add')openEdit(null);
    else if(act==='worlds')openWorlds();
    else if(act==='edit'&&S.detail)openEdit(S.detail);
    else if(act==='close'){var d=t.closest('dialog');if(d)closeD(d)}
    else if(act==='ask-del'){$('#dActions').innerHTML=actionsHTML(true)}
    else if(act==='cancel-del'){$('#dActions').innerHTML=actionsHTML(false)}
    else if(act==='do-del'&&S.detail){
      del('characters',S.detail.id).then(function(){closeD($('#dlgDetail'));toast('삭제했어요.')}).catch(function(){toast(SAVE_ERR)});
    }
    return;
  }
  var dlg=e.target;
  if(dlg&&dlg.tagName==='DIALOG')closeD(dlg);
});

$('#editForm').addEventListener('submit',function(e){e.preventDefault();saveChar()});
$('#worldsForm').addEventListener('submit',function(e){e.preventDefault();saveWorlds()});
$('#srows').addEventListener('input',updatePreview);
$('#picClear').addEventListener('click',function(){S.img='';$('#picFile').value='';updatePic()});
$('#picFile').addEventListener('change',function(){
  var f=this.files&&this.files[0];if(!f)return;
  fileToDataURL(f).then(function(d){S.img=d;updatePic()}).catch(function(){toast('이미지를 불러오지 못했어요. 다른 파일로 시도해 주세요.')});
});

$('#wAdd').addEventListener('click',function(){
  S.draft.push({id:newId('w'),name:'',color:COLORS[S.draft.length%COLORS.length],desc:''});
  renderWorlds();
  var el=$('#wn'+(S.draft.length-1));if(el)el.focus();
});
$('#wlist').addEventListener('click',function(e){
  var sw=e.target.closest('.sw'),del_=e.target.closest('[data-del]');
  if(sw){var i=+sw.closest('.wrow').getAttribute('data-i');S.draft[i].color=sw.getAttribute('data-c');renderWorlds()}
  else if(del_){var j=+del_.getAttribute('data-del');var w=S.draft[j];if(S.worlds.some(function(x){return x.id===w.id}))S.removed.push(w.id);S.draft.splice(j,1);renderWorlds()}
});
$('#wlist').addEventListener('input',function(e){
  var row=e.target.closest('.wrow');if(!row)return;
  var i=+row.getAttribute('data-i');
  if(e.target.classList.contains('wn'))S.draft[i].name=e.target.value;
  if(e.target.classList.contains('wd'))S.draft[i].desc=e.target.value;
});

/* ---------- 백업 ---------- */
var impData=null;
var pad2=function(n){return String(n).padStart(2,'0')};
function cleanWorld(w,i){
  return {id:String(w.id||newId('w')).slice(0,80),name:String(w.name||'이름 없음').slice(0,24),color:okColor(w.color),desc:String(w.desc||'').slice(0,120),order:Number(w.order)||i};
}
function cleanChar(c){
  var o=norm(c);
  ['name','worldId','bio','age','gender','height','weight','personality','traits','songTitle','songArtist','songUrl'].forEach(function(k){o[k]=String(o[k]==null?'':o[k])});
  o.id=String(c.id||newId('c')).slice(0,80);
  o.name=(o.name||'이름 없음').slice(0,24);
  o.createdAt=Number(o.createdAt)||0;
  if(!okImg(o.image))o.image='';
  return o;
}
function upsert(arr,obj){var i=arr.findIndex(function(x){return x.id===obj.id});if(i<0)arr.push(obj);else arr[i]=obj}
async function applyImport(d,mode){
  var worlds=d.worlds.map(cleanWorld),chars=d.chars.map(cleanChar);
  if(mode==='replace'){
    var ow=S.worlds.slice(),oc=S.chars.slice();
    for(var a=0;a<ow.length;a++)await unpersist('worlds',ow[a].id);
    for(var b=0;b<oc.length;b++)await unpersist('characters',oc[b].id);
    S.worlds=[];S.chars=[];
  }
  worlds.forEach(function(w){upsert(S.worlds,w)});
  chars.forEach(function(c){upsert(S.chars,c)});
  S.worlds.sort(cmpW);S.chars.sort(cmpC);
  for(var i=0;i<worlds.length;i++)await persist('worlds',worlds[i]);
  for(var j=0;j<chars.length;j++)await persist('characters',chars[j]);
  render();
}
$('#btnExport').addEventListener('click',function(){
  try{
    var d=new Date(),name='oc-archive-'+d.getFullYear()+pad2(d.getMonth()+1)+pad2(d.getDate())+'.json';
    var blob=new Blob([JSON.stringify({app:'oc-archive',version:1,exportedAt:d.toISOString(),worlds:S.worlds,chars:S.chars})],{type:'application/json'});
    var url=URL.createObjectURL(blob),a=document.createElement('a');
    a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
    setTimeout(function(){URL.revokeObjectURL(url)},4000);
    toast('백업 파일을 내려받았어요.');
  }catch(e){toast('백업 파일을 만들지 못했어요.')}
});
$('#btnImport').addEventListener('click',function(){$('#impFile').click()});
$('#impFile').addEventListener('change',function(){
  var f=this.files&&this.files[0];this.value='';
  if(!f)return;
  var fr=new FileReader();
  fr.onerror=function(){toast('파일을 읽지 못했어요.')};
  fr.onload=function(){
    var d=null;try{d=JSON.parse(fr.result)}catch(e){}
    if(!d||d.app!=='oc-archive'||!Array.isArray(d.chars)||!Array.isArray(d.worlds)){toast('이 설정집의 백업 파일이 아니에요.');return}
    impData=d;
    $('#impInfo').textContent='파일에 캐릭터 '+d.chars.length+'명, 카테고리 '+d.worlds.length+'개가 들어 있어요.';
    $('#impMerge').checked=true;$('#impWarn').hidden=true;
    openD($('#dlgImport'));
  };
  fr.readAsText(f);
});
$('#impMerge').addEventListener('change',function(){$('#impWarn').hidden=true});
$('#impReplace').addEventListener('change',function(){$('#impWarn').hidden=false});
$('#importForm').addEventListener('submit',async function(e){
  e.preventDefault();
  if(!impData)return;
  var btn=$('#impGo');btn.disabled=true;
  try{
    await applyImport(impData,$('#impReplace').checked?'replace':'merge');
    closeD($('#dlgImport'));toast('백업을 불러왔어요.');
  }catch(err){toast('불러오지 못했어요. 브라우저 저장 공간을 확인해 주세요.')}
  btn.disabled=false;
});

/* ---------- 시작 ---------- */
buildRows();
render();
(async function(){
  var db=null,user=null;
  try{if(window.claude&&window.claude.use){var r=await Promise.all([window.claude.use('db'),window.claude.use('user')]);db=r[0];user=r[1]}}catch(e){}
  var uid=null;
  if(user){try{uid=await user.id()}catch(e){}try{if(user.can&&user.can('data.write')===false)S.canWrite=false}catch(e){}}
  if(!db||!uid){
    S.local=true;await initLocal();
    $('#notice').textContent='이 브라우저에만 저장돼요. 다른 기기나 브라우저에서 쓰려면 “백업 내보내기”로 파일을 만들어 옮겨 주세요.';
    $('#notice').hidden=false;
    render();return;
  }
  S.db=db;S.base=db.doc('data/users/'+uid+'/profile');
  $('#priv').hidden=false;
  if(!S.canWrite){$('#notice').textContent='보기 권한이라 저장할 수 없어요. 기여자(Contributor) 권한이 필요해요.';$('#notice').hidden=false}
  var fail=function(){$('#notice').textContent='저장소 연결이 끊겼어요. 페이지를 새로고침해 주세요.';$('#notice').hidden=false};
  S.base.collection('worlds').onSnapshot(function(s){S.worlds=s.docs.map(function(d){var o=d.data()||{};o.id=d.id;return o}).sort(cmpW);render()},fail);
  S.base.collection('characters').onSnapshot(function(s){S.chars=s.docs.map(function(d){var o=d.data()||{};o.id=d.id;return norm(o)}).sort(cmpC);render()},fail);
})();
})();
</script>
