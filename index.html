<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>캐릭터 설정집</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
[hidden]{display:none!important}
img{max-width:100%}
/* Layout: 와이어프레임 그대로. 메인은 왼쪽 검색·카테고리 / 오른쪽 정사각 프로필 3열. 캐릭터 페이지는 색 원 열 | 전신 일러스트 | 이름·탭 정보. 흰 바탕 한 가지 테마. */
:root{
  color-scheme:light;
  --bg:#FFFFFF;
  --ink:#111111;
  --sub:#5F5F5F;
  --mid:#767676;
  --faint:#BDBDBD;
  --line:#E3E3E3;
  --ph:#D3D3D3;
  --ph-ink:#9C9C9C;
  --field:#EFEFEF;
  --danger:#C2343F;
  --on-ink:#FFFFFF;
  --font:"Pretendard Variable","Pretendard",-apple-system,BlinkMacSystemFont,system-ui,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
h1,h2,h3,p,dl,dd,ul{margin:0}
ul{padding:0;list-style:none}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;background:none;border:0;padding:0;text-align:inherit}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font:400 16px/1.6 var(--font);letter-spacing:-0.01em;
  -webkit-font-smoothing:antialiased;
  padding-block:0 96px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.page{max-width:1720px;margin-inline:auto;padding-inline:clamp(0px,3.6vw,84px)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.none{color:var(--faint)}

/* ---------- 공통 요소 ---------- */
.sq{position:relative;display:block;aspect-ratio:1/1;width:100%;max-width:100%;background:var(--ph);overflow:hidden}
.sq img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.sq img.top{object-position:center top}
.sq .ini{position:absolute;inset:0;display:grid;place-items:center;font-weight:600;color:var(--ph-ink);font-size:clamp(28px,3.6vw,60px)}
.btn{display:inline-flex;align-items:center;justify-content:center;height:40px;padding:0 18px;border:1px solid var(--line);background:var(--bg);font-size:15px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
.btn:disabled{opacity:.5;cursor:default}
.mini-btn{font-size:14px;color:var(--sub);padding:4px 2px;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--faint)}
.mini-btn:hover{color:var(--ink)}
.mini-btn.danger{color:var(--danger)}
.in{width:100%;min-width:0;border:0;border-bottom:1px solid var(--line);background:transparent;padding:8px 0;border-radius:0}
.in:focus{outline:none;border-bottom-color:var(--ink)}
.in::placeholder{color:var(--faint)}
select.in{padding-right:4px;cursor:pointer}
textarea.in{display:block;resize:vertical;min-height:260px;line-height:1.75;border:1px solid var(--line);padding:14px 16px}
textarea.in:focus{border-color:var(--ink)}
textarea.in.short{min-height:84px;padding:10px 12px}

/* ---------- 메인 ---------- */
.home-head{padding-block:clamp(40px,6.5vw,104px) clamp(36px,5.6vw,92px)}
.home-head h1{font-size:clamp(40px,4.3vw,76px);font-weight:500;line-height:1.1;letter-spacing:-0.02em}
.home{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);column-gap:clamp(32px,7.6vw,146px);align-items:start}
.side{display:flex;flex-direction:column;gap:clamp(40px,5.4vw,100px);min-width:0;position:sticky;top:calc(24px + env(safe-area-inset-top,0px))}
.search{position:relative;color:var(--ink)}
.search input{width:100%;height:60px;border:0;border-radius:0;background:var(--field);padding:0 56px 0 18px;font-size:17px;-webkit-appearance:none;appearance:none}
.search input::placeholder{color:var(--ph-ink)}
.search input:focus{outline:2px solid var(--ink);outline-offset:0}
.search svg{position:absolute;right:16px;top:50%;width:28px;height:28px;transform:translateY(-50%);pointer-events:none}
.cats{display:flex;flex-direction:column;gap:16px}
.cat-row{display:flex;align-items:baseline;gap:12px}
.cat{font-size:clamp(19px,1.3vw,24px);color:var(--sub);line-height:1.3;overflow-wrap:anywhere}
.cat.all{font-size:clamp(23px,1.6vw,30px);font-weight:500}
.cat:hover{color:var(--ink)}
.cat[aria-current="true"]{color:var(--ink);font-weight:600}
.cat-tool{font-size:13px;color:var(--faint);white-space:nowrap}
.cat-tool:hover{color:var(--ink)}
.cat-add{font-size:clamp(15px,1vw,18px);color:var(--faint);margin-top:2px}
.cat-add:hover{color:var(--sub)}
.cat-form{display:flex;flex-direction:column;gap:8px}
.cat-form .in{font-size:19px}
.cat-actions{display:flex;flex-wrap:wrap;gap:4px 14px}
.cat-ask{font-size:14px;color:var(--sub);max-width:28ch}
.side-foot{display:flex;flex-direction:column;gap:8px;font-size:13px;color:var(--ph-ink)}
.side-foot .links{display:flex;flex-wrap:wrap;gap:4px 14px}
.side-foot .mini-btn{font-size:13px}

.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));column-gap:clamp(20px,4.4vw,84px);row-gap:clamp(32px,3.6vw,64px);min-width:0;align-items:start}
.card{display:flex;flex-direction:column;gap:clamp(10px,.9vw,16px);min-width:0}
.card-txt{display:flex;flex-direction:column;gap:2px;padding-inline:clamp(4px,.5vw,10px);min-width:0}
.card-name{font-size:clamp(18px,1.55vw,28px);font-weight:500;line-height:1.3;overflow-wrap:anywhere}
.card-kw{font-size:clamp(14px,.95vw,17px);color:var(--mid);line-height:1.45;overflow-wrap:anywhere}
.card .tag{position:absolute;left:10px;top:10px;background:var(--ink);color:var(--on-ink);font-size:12px;font-weight:600;padding:3px 8px;letter-spacing:.04em}
.card-add .sq{background:transparent;border:1.5px dashed var(--faint);display:grid;place-items:center;color:var(--sub);font-size:clamp(15px,1.15vw,20px)}
.card-add:hover .sq{border-color:var(--ink);color:var(--ink)}
.grid-msg{grid-column:1/-1;color:var(--sub);font-size:17px}

/* ---------- 캐릭터 페이지 ---------- */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px 16px;padding-block:18px;margin-bottom:clamp(20px,3.6vw,64px)}
.back{font-size:17px;color:var(--sub)}
.back:hover{color:var(--ink)}
.bar-title{font-size:17px;font-weight:600}
.bar-actions{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.bar-note{font-size:14px;color:var(--ph-ink)}

.detail{display:grid;grid-template-columns:62px minmax(0,516px) minmax(0,1fr);grid-template-areas:"sw full info";column-gap:clamp(16px,1.95vw,37px);align-items:start}
.swatches{grid-area:sw;display:flex;flex-direction:column;align-items:center;gap:20px}
.full{grid-area:full}
.info{grid-area:info;min-width:0;padding-left:clamp(0px,3.3vw,63px);display:flex;flex-direction:column}

.sw{position:relative;display:grid;place-items:center;width:62px;height:62px;border-radius:50%;background:var(--ph);font-size:14px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.sw input[type=color]{position:absolute;inset:0;width:100%;height:100%;opacity:0;border:0;padding:0;cursor:pointer}
.sw:focus-within{outline:2px solid var(--ink);outline-offset:3px}
.sw-wrap{position:relative}
.sw-x{position:absolute;right:-6px;top:-6px;width:22px;height:22px;border-radius:50%;background:var(--ink);color:var(--on-ink);font-size:14px;line-height:22px;text-align:center}
.sw-add{background:transparent;border:1.5px dashed var(--faint);box-shadow:none;font-size:24px;color:var(--sub)}
.sw-add:hover{border-color:var(--ink);color:var(--ink)}
.sw-cap{font-size:12px;color:var(--ph-ink);margin-top:-12px;white-space:nowrap}

.full{position:relative;display:block;width:100%;max-width:100%;aspect-ratio:516/861;background:var(--ph);overflow:hidden}
.full.has{background:transparent}
.full img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block}
.full .ph{position:absolute;inset:0;display:grid;place-items:center;font-size:clamp(20px,1.9vw,36px);color:var(--ph-ink);text-align:center;padding:16px}
.full-pick{position:absolute;inset:0;display:grid;place-items:center;font-size:clamp(17px,1.5vw,26px);color:var(--sub);text-align:center;padding:16px}
.full.has .full-pick{color:transparent}
.full.has .full-pick:hover,.full.has .full-pick:focus-visible{background:rgba(255,255,255,.8);color:var(--ink)}
.img-x{position:absolute;right:10px;bottom:10px;background:var(--ink);color:var(--on-ink);font-size:13px;padding:5px 10px}
button.full{cursor:zoom-in}

.d-name{font-size:clamp(36px,3.4vw,66px);font-weight:700;line-height:1.15;letter-spacing:-0.025em;overflow-wrap:anywhere;text-wrap:balance}
.d-kw{margin-top:clamp(12px,1.2vw,20px);display:flex;flex-wrap:wrap;gap:2px 8px;font-size:17px;font-weight:500}
.d-intro{margin-top:clamp(10px,1vw,16px);font-size:clamp(18px,1.25vw,24px);overflow-wrap:anywhere}
.in-name{font-size:clamp(30px,2.9vw,56px);font-weight:700;letter-spacing:-0.025em;padding-block:2px 6px}
.in-kw{margin-top:14px;font-size:17px;font-weight:500}
.in-intro{margin-top:6px;font-size:clamp(17px,1.2vw,22px)}
.meta-edit{margin-top:24px;display:flex;flex-wrap:wrap;gap:20px 40px;align-items:flex-start}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.f-lab{font-size:13px;font-weight:600;color:var(--sub)}
.field small{font-size:12px;color:var(--ph-ink);max-width:34ch}
.field select.in{min-width:180px}
.pf{display:flex;align-items:center;gap:14px}
.pf .sq{width:72px;flex:none}
.pf .sq .ini{font-size:24px}
.pf-btns{display:flex;flex-direction:column;align-items:flex-start;gap:2px}

.tabs{margin-top:clamp(36px,5.2vw,96px);display:flex;gap:clamp(22px,4.6vw,90px);border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tab{font-size:clamp(19px,1.45vw,27px);font-weight:700;color:var(--faint);padding-bottom:14px;white-space:nowrap}
.tab:hover{color:var(--sub)}
.tab[aria-selected="true"]{color:var(--ink)}
.panel{padding-top:clamp(18px,1.6vw,26px);min-width:0}

.rows{display:grid;grid-template-columns:minmax(96px,258px) minmax(0,1fr);row-gap:clamp(18px,2vw,34px);column-gap:16px;font-size:17px}
.row{display:contents}
.rows dd{overflow-wrap:anywhere}
.rows.ed{row-gap:14px;align-items:end}
.rows.ed label{padding-bottom:8px}
.hw{display:flex;align-items:end;gap:10px}
.hw span{padding-bottom:8px;color:var(--sub)}

.gal{margin-top:clamp(40px,5.6vw,108px);display:grid;grid-template-columns:repeat(4,minmax(0,172px));gap:clamp(12px,1.25vw,24px)}
.gal-slot{position:relative}
.gal-add{display:grid;place-items:center;aspect-ratio:1/1;width:100%;border:1.5px dashed var(--faint);color:var(--sub);font-size:14px;text-align:center;padding:8px}
.gal-add:hover{border-color:var(--ink);color:var(--ink)}
.gal-slot .img-x{right:6px;bottom:6px;padding:3px 8px;font-size:12px}
.gal-tools{position:absolute;right:6px;bottom:6px;display:flex;gap:4px}
.gal-tools button{background:var(--ink);color:var(--on-ink);font-size:12px;padding:3px 8px}
button.sq{cursor:zoom-in}

.text{white-space:pre-wrap;overflow-wrap:anywhere;max-width:68ch;font-size:17px;line-height:1.8}

.rels{display:flex;flex-direction:column;gap:clamp(28px,2.6vw,48px);padding-top:clamp(8px,1.2vw,20px)}
.rel{display:grid;grid-template-columns:clamp(84px,8vw,154px) minmax(0,1fr);gap:clamp(16px,2vw,38px);align-items:start}
a.rel:hover .rel-name{text-decoration:underline;text-underline-offset:4px}
.rel-txt{display:flex;flex-direction:column;gap:clamp(4px,.6vw,10px);padding-top:8px;min-width:0}
.rel-name{font-size:clamp(17px,1.15vw,22px);font-weight:500;overflow-wrap:anywhere}
.rel-type{font-size:clamp(17px,1.15vw,22px);font-weight:600;overflow-wrap:anywhere}
.rel-note{font-size:17px;white-space:pre-wrap;overflow-wrap:anywhere}
.rel-fields{display:flex;flex-direction:column;gap:6px;min-width:0}
.rel-fields .mini-btn{align-self:flex-start;margin-top:4px}
.add-link{align-self:flex-start;font-size:17px;color:var(--sub);border:1.5px dashed var(--faint);padding:10px 18px}
.add-link:hover{border-color:var(--ink);color:var(--ink)}
.hint{font-size:14px;color:var(--ph-ink)}

.danger-zone{margin-top:clamp(48px,5vw,96px);padding-top:20px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px}
.danger-zone p{font-size:15px;color:var(--sub)}
.btn.danger{color:var(--danger)}
.btn.danger:hover{border-color:var(--danger)}
.btn.danger.solid{background:var(--danger);border-color:var(--danger);color:var(--on-ink)}
.load-msg{font-size:17px;color:var(--sub)}

/* ---------- 대화상자, 알림 ---------- */
dialog{border:0;padding:0;background:var(--bg);color:var(--ink);max-width:calc(100% - 24px);max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));overflow:auto}
dialog::backdrop{background:rgba(17,17,17,.6)}
#lb{background:transparent}
#lb img{display:block;max-width:min(92vw,1400px);max-height:calc(100dvh - 90px);object-fit:contain;background:var(--bg)}
#lb .lb-close{display:block;margin:10px auto 0;color:var(--on-ink);font-size:15px;text-decoration:underline;text-underline-offset:3px}
.imp{padding:28px;width:min(500px,calc(100vw - 24px));display:flex;flex-direction:column;gap:18px}
.imp h2{font-size:22px;font-weight:700}
.imp p{color:var(--sub)}
.imp label{display:flex;gap:10px;align-items:flex-start}
.imp input[type=radio]{margin-top:5px;accent-color:var(--ink)}
.imp .warn{color:var(--danger);font-size:14px}
.imp .acts{display:flex;justify-content:flex-end;gap:8px}
.sheet-dlg{padding:24px;width:min(760px,calc(100vw - 24px));display:flex;flex-direction:column;gap:14px}
.sheet-h{font-size:22px;font-weight:700}
.sheet-opts{display:flex;flex-wrap:wrap;align-items:center;gap:8px 22px}
.so-lab{width:100%;font-size:14px;color:var(--sub)}
.chk:has(input:disabled){color:var(--faint);cursor:default}
.chk{display:flex;align-items:center;gap:8px;font-size:15px;cursor:pointer}
.chk input{width:18px;height:18px;margin:0;accent-color:var(--ink)}
.sheet-prev{max-height:58dvh;overflow:auto;border:1px solid var(--line);background:var(--field);min-height:120px;display:grid;place-items:center}
.sheet-prev img{display:block;width:100%;height:auto;align-self:start}
.sheet-dlg .acts{display:flex;justify-content:flex-end;flex-wrap:wrap;gap:8px}
.crop-dlg{padding:24px;width:min(520px,calc(100vw - 24px));display:flex;flex-direction:column;gap:14px}
.crop-stage{position:relative;width:100%;max-width:440px;aspect-ratio:1/1;margin-inline:auto;overflow:hidden;cursor:grab;touch-action:none;-webkit-user-select:none;user-select:none;background:repeating-conic-gradient(var(--field) 0% 25%,var(--bg) 0% 50%) 50%/20px 20px;box-shadow:0 0 0 1px var(--line)}
.crop-stage:active{cursor:grabbing}
.crop-stage img{position:absolute;left:0;top:0;max-width:none;transform-origin:0 0;pointer-events:none;-webkit-user-select:none;user-select:none}
.crop-zoom{display:flex;align-items:center;gap:12px;font-size:14px;color:var(--sub)}
.crop-zoom input{flex:1;min-width:0;accent-color:var(--ink)}
.crop-dlg .acts{display:flex;justify-content:flex-end;gap:8px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:50;background:var(--ink);color:var(--on-ink);padding:11px 18px;font-size:15px;max-width:calc(100% - 32px)}

/* ---------- 반응형 ---------- */
@media (max-width:1180px){
  .detail{grid-template-columns:54px minmax(0,380px) minmax(0,1fr)}
  .sw{width:54px;height:54px}
}
@media (max-width:1000px){
  .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:860px){
  .home{grid-template-columns:minmax(0,1fr);row-gap:18px}
  .side nav{margin-bottom:10px}
  .side{display:contents}
  .search{order:1}
  .side nav{order:2}
  .grid{order:3}
  .side-foot{order:4;margin-top:24px}
  .cats{flex-direction:row;align-items:baseline;gap:22px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
  .cats>li{flex:none}
  .cat,.cat.all{font-size:19px;white-space:nowrap}
  .cat-add{font-size:16px;white-space:nowrap}
  .cat-form{min-width:220px}
  .detail{grid-template-columns:minmax(0,1fr);grid-template-areas:"full" "sw" "info";row-gap:22px}
  .full{width:min(100%,380px)}
  .swatches{flex-direction:row;flex-wrap:wrap;align-items:center;gap:14px}
  .sw{width:46px;height:46px;font-size:12px}
  .sw-cap{margin-top:0}
  .info{padding-left:0}
}
@media (max-width:520px){
  .rows{grid-template-columns:96px minmax(0,1fr)}
  .rel{grid-template-columns:76px minmax(0,1fr);gap:14px}
  .rel-txt{padding-top:0}
  .gal{grid-template-columns:repeat(4,minmax(0,1fr))}
}
@media (prefers-reduced-motion:no-preference){
  .card .sq img{transition:transform .3s ease}
  .card:hover .sq img{transform:scale(1.03)}
}
</style>
</head>
<body>
<div class="page">
  <section id="home">
    <header class="home-head"><h1>Character</h1></header>
    <div class="home">
      <aside class="side">
        <div class="search">
          <input type="search" id="q" placeholder="캐릭터 검색" aria-label="캐릭터 검색" autocomplete="off">
          <svg viewBox="0 0 28 28" aria-hidden="true"><circle cx="11.5" cy="11.5" r="8" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M17.5 17.5 25 25" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg>
        </div>
        <nav aria-label="카테고리"><ul class="cats" id="cats"></ul></nav>
        <div class="side-foot">
          <p id="storeNote">불러오는 중…</p>
          <div class="links">
            <button type="button" class="mini-btn" id="btnExport" hidden>백업 내보내기</button>
            <button type="button" class="mini-btn" id="btnImport" hidden>백업 불러오기</button>
          </div>
        </div>
      </aside>
      <main class="grid" id="grid" aria-label="캐릭터 목록"></main>
    </div>
  </section>
  <section id="detail" hidden></section>
</div>

<input type="file" id="filePick" accept="image/*" hidden aria-label="이미지 파일 선택">
<input type="file" id="impFile" accept=".json,application/json" hidden aria-label="백업 파일 선택">

<dialog id="lb" aria-label="이미지 크게 보기">
  <img id="lbImg" alt="">
  <button type="button" class="lb-close" data-act="close">닫기</button>
</dialog>

<dialog id="dlgImport" aria-label="백업 불러오기">
  <form class="imp" id="importForm" data-form="import">
    <h2>백업 불러오기</h2>
    <p id="impInfo"></p>
    <label><input type="radio" name="impMode" id="impMerge" value="merge" checked><span>지금 데이터에 합치기 (같은 캐릭터는 파일 내용으로 바뀌어요)</span></label>

<script>
(function(){
'use strict';
var $=function(s,r){return (r||document).querySelector(s)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var HEX=/^#[0-9a-fA-F]{6}$/;
var ID_OK=/^[A-Za-z0-9_-]{1,80}$/;
var okImg=function(s){return typeof s==='string'&&/^data:image\/(jpeg|png|webp|gif);base64,/.test(s)};
var newId=function(p){return p+Date.now().toString(36)+Math.random().toString(36).slice(2,7)};
var initial=function(n){return Array.from(String(n||'?').trim()||'?')[0]};
var IN_CLAUDE=!!(window.claude&&typeof window.claude.use==='function');
var SLOTS=['image','full','g0','g1','g2','g3'];
var CLOUD_IMG=230000;
var SPEC={image:{dim:800,budget:400000},full:{dim:1700,budget:1400000},gallery:{dim:1200,budget:800000}};
var ERR='저장하지 못했어요. 저장 공간이 부족하거나 연결이 끊겼을 수 있어요.';

var S={mode:'memory',ready:false,canWrite:true,worlds:[],chars:[],img:{},filter:'all',q:'',catMode:null,
  view:'home',viewId:null,tab:'profile',editing:false,draft:null,delAsk:false,pickSlot:null,imp:null};

/* ---------- 데이터 모양 ---------- */
var TEXT_F=['name','worldId','intro','age','height','weight','birthday','likes','dislikes','setting','secret','image','full'];
function normChar(c){
  var o={};for(var k in c)o[k]=c[k];
  TEXT_F.forEach(function(k){o[k]=o[k]==null?'':String(o[k])});
  o.keywords=Array.isArray(c.keywords)?c.keywords.map(String).filter(Boolean):[];
  o.colors=Array.isArray(c.colors)?c.colors.filter(function(x){return HEX.test(x||'')}):[];
  o.gallery=[0,1,2,3].map(function(i){var g=Array.isArray(c.gallery)?c.gallery[i]:'';return g?String(g):''});
  o.galleryCrop=[0,1,2,3].map(function(i){return normCrop(Array.isArray(c.galleryCrop)?c.galleryCrop[i]:null)});
  o.relations=Array.isArray(c.relations)?c.relations.filter(function(r){return r&&typeof r==='object'}).map(function(r){
    return {targetId:String(r.targetId||''),name:String(r.name||''),rel:String(r.rel||''),note:String(r.note||''),image:String(r.image||'')};
  }):[];
  o.createdAt=Number(c.createdAt)||0;
  return o;
}
/* 캐 이미지가 정사각형 칸에 보일 영역: l,t = 원본 너비/높이 대비 시작점, sz = 원본 너비 대비 한 변, r = 원본 높이/너비 */
function normCrop(v){
  if(!v||typeof v!=='object')return null;
  var l=+v.l,t=+v.t,sz=+v.sz,r=+v.r;
  if(![l,t,sz,r].every(isFinite)||sz<=0||r<=0)return null;
  return {l:l,t:t,sz:sz,r:r};
}
function cropStyle(cr){
  if(!cr)return '';
  var w=100/cr.sz;
  return ' style="inset:auto;max-width:none;width:'+w.toFixed(3)+'%;height:auto;left:'+(-cr.l*w).toFixed(3)+'%;top:'+(-cr.t*cr.r*w).toFixed(3)+'%"';
}
function legacySetting(c){
  var p=[];
  if(c.gender)p.push('성별: '+c.gender);
  if(c.personality)p.push('성격: '+c.personality);
  if(c.traits)p.push('특징: '+c.traits);
  if(c.bio)p.push(String(c.bio));
  return p.join('\n');
}
var cmpW=function(a,b){return (Number(a.order)||0)-(Number(b.order)||0)||String(a.name).localeCompare(String(b.name))};
var cmpC=function(a,b){return (a.createdAt||0)-(b.createdAt||0)};
function upsert(arr,o){var i=arr.findIndex(function(x){return x.id===o.id});if(i<0)arr.push(o);else arr[i]=o}
function findChar(id){for(var i=0;i<S.chars.length;i++){if(S.chars[i].id===id)return S.chars[i]}return null}
function getSlot(c,s){if(s[0]==='g')return c.gallery[+s.slice(1)];if(s[0]==='r'){var r=c.relations[+s.slice(1)];return r?r.image:''}return c[s]}
function setSlot(c,s,v){if(s[0]==='g')c.gallery[+s.slice(1)]=v;else if(s[0]==='r'){var r=c.relations[+s.slice(1)];if(r)r.image=v}else c[s]=v}
function allSlots(c){return SLOTS.concat((c.relations||[]).map(function(r,i){return 'r'+i}))}
function imgIds(c){return allSlots(c).map(function(s){return getSlot(c,s)}).filter(function(v){return v&&v.indexOf('data:')!==0})}
function imgSrc(v){if(!v)return '';if(v.indexOf('data:')===0)return okImg(v)?v:'';return S.img[v]||''}
function thumb(c){var a=imgSrc(c.image);if(a)return {src:a,top:false};var b=imgSrc(c.full);return b?{src:b,top:true}:null}
function parseKw(s){
  var out=[];
  String(s).split(/[,，、#\n]/).forEach(function(x){x=x.trim().slice(0,20);if(x&&out.indexOf(x)<0)out.push(x)});
  return out.slice(0,6);
}

var EX=normChar({id:'example',name:'세린 아르덴',keywords:['방랑 검사','냉정함','별빛 수집가'],
  intro:'사라진 스승의 검을 찾아 대륙을 떠도는 검사.',colors:['#2E3A5C','#C9D6EA','#B23A48'],
  age:'24세',height:'168cm',weight:'54kg',birthday:'12월 3일',likes:'별 관측, 따뜻한 우유',dislikes:'약속을 어기는 사람',
  setting:'북쪽 설원 마을 출신. 열두 살에 떠돌이 검사였던 스승을 만나 검을 배웠다.\n스승이 사라진 밤, 하늘에서 별 하나가 떨어지는 것을 보았고 그 뒤로 떨어진 별의 조각을 모으며 스승의 흔적을 쫓고 있다.',
  secret:'스승을 사라지게 만든 것이 어린 시절의 자신이라는 사실을 아직 기억하지 못한다.',
  relations:[{name:'루카스 벨',rel:'소꿉친구',note:'같은 마을에서 자랐다. 세린이 마을을 떠난 뒤에도 편지를 보낸다.'}]});

/* ---------- 저장소 ---------- */
var IDB=null,CLOUD=null;
function idbOpen(){return new Promise(function(res,rej){
  var r;try{r=indexedDB.open('oc-archive',2)}catch(e){rej(e);return}
  r.onupgradeneeded=function(){var d=r.result;['worlds','chars','images'].forEach(function(n){if(!d.objectStoreNames.contains(n))d.createObjectStore(n,{keyPath:'id'})})};
  r.onsuccess=function(){res(r.result)};
  r.onerror=function(){rej(r.error)};
  r.onblocked=function(){rej(new Error('blocked'))};
})}
function idbRun(store,mode,fn){return new Promise(function(res,rej){
  var tx=IDB.transaction(store,mode),req=fn(tx.objectStore(store));
  tx.oncomplete=function(){res(req&&req.result)};
  tx.onerror=function(){rej(tx.error)};
  tx.onabort=function(){rej(tx.error||new Error('abort'))};
})}
var KIND={worlds:['worlds','worlds'],chars:['chars','characters'],images:['images','images']};
async function write(kind,obj){
  if(S.mode==='local')return idbRun(KIND[kind][0],'readwrite',function(s){return s.put(obj)});
  if(S.mode==='cloud'){var r={};for(var k in obj){if(k!=='id'&&obj[k]!==undefined)r[k]=obj[k]}return CLOUD.collection(KIND[kind][1]).doc(obj.id).set(r)}
}
async function remove(kind,id){
  if(S.mode==='local')return idbRun(KIND[kind][0],'readwrite',function(s){return s.delete(id)});
  if(S.mode==='cloud')return CLOUD.collection(KIND[kind][1]).doc(id).delete();
}
var Store={
  putChar:async function(c){upsert(S.chars,c);S.chars.sort(cmpC);schedule();await write('chars',c)},
  delChar:async function(id){S.chars=S.chars.filter(function(x){return x.id!==id});schedule();await remove('chars',id)},
  putCat:async function(w){upsert(S.worlds,w);S.worlds.sort(cmpW);schedule();await write('worlds',w)},
  delCat:async function(id){S.worlds=S.worlds.filter(function(x){return x.id!==id});schedule();await remove('worlds',id)},
  putImg:async function(id,data){
    if(S.mode==='cloud'&&data.length>CLOUD_IMG)data=await encode(data,1100,CLOUD_IMG);
    S.img[id]=data;await write('images',{id:id,data:data});
  },
  delImg:async function(id){delete S.img[id];await remove('images',id)}
};

/* ---------- 이미지 줄이기 ---------- */
var WEBP=(function(){try{var c=document.createElement('canvas');c.width=c.height=1;return c.toDataURL('image/webp').indexOf('data:image/webp')===0}catch(e){return false}})();
function loadImg(src){return new Promise(function(res,rej){var im=new Image();im.onload=function(){res(im)};im.onerror=function(){rej(new Error('img'))};im.src=src})}
function hasAlpha(im){
  try{
    var W=im.naturalWidth||im.width||1,H=im.naturalHeight||im.height||1,k=Math.min(1,160/Math.max(W,H));
    var c=document.createElement('canvas');c.width=Math.max(1,Math.round(W*k));c.height=Math.max(1,Math.round(H*k));
    var x=c.getContext('2d');x.drawImage(im,0,0,c.width,c.height);
    var px=x.getImageData(0,0,c.width,c.height).data;
    for(var i=3;i<px.length;i+=4){if(px[i]<250)return true}
  }catch(e){}
  return false;
}
async function encode(src,maxDim,budget){
  var im=await loadImg(src);
  var W=im.naturalWidth||im.width||1,H=im.naturalHeight||im.height||1,big=Math.max(W,H);
  /* 투명한 부분이 있으면 투명을 지원하는 형식(WebP, 안 되면 PNG)으로만 저장 */
  var alpha=hasAlpha(im);
  var type=WEBP?'image/webp':(alpha?'image/png':'image/jpeg');
  var steps=[1,.85,.7,.55,.45,.35,.25];
  for(var a=0;a<steps.length;a++){
    var k=Math.min(1,(maxDim*steps[a])/big);
    var w=Math.max(1,Math.round(W*k)),h=Math.max(1,Math.round(H*k));
    var c=document.createElement('canvas');c.width=w;c.height=h;
    var x=c.getContext('2d');
    if(type==='image/jpeg'){x.fillStyle='#FFFFFF';x.fillRect(0,0,w,h)}
    x.drawImage(im,0,0,w,h);
    var qs=type==='image/png'?[1]:[.92,.85,.75,.65];
    for(var b=0;b<qs.length;b++){
      var d=c.toDataURL(type,qs[b]);
      if(d.indexOf('data:'+type)!==0)continue;
      if(d.length<=budget)return d;
    }
  }
  throw new Error('too big');
}
function readFile(f){return new Promise(function(res,rej){var r=new FileReader();r.onload=function(){res(r.result)};r.onerror=function(){rej(r.error)};r.readAsDataURL(f)})}
/* 이미 충분히 작은 파일은 다시 압축하지 않고 원본 그대로(투명 배경 포함) 저장 */
async function prepareImage(f,maxDim,budget){
  var raw=await readFile(f);
  if(okImg(raw)&&raw.length<=budget){
    var im=await loadImg(raw);
    if(Math.max(im.naturalWidth||1,im.naturalHeight||1)<=maxDim*1.25)return raw;
  }
  return encode(raw,maxDim,budget);
}

/* ---------- 작은 도구 ---------- */
var toastT=0;
function toast(m){var t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(function(){t.hidden=true},3400)}
function openD(d){try{d.showModal()}catch(e){d.setAttribute('open','')}}
function closeD(d){if(!d)return;try{d.close()}catch(e){d.removeAttribute('open')}}
function autosize(t){t.style.height='auto';t.style.height=(t.scrollHeight+2)+'px'}
function sqHTML(th,name,tag){
  return '<span class="sq">'+(th?'<img src="'+esc(th.src)+'" alt=""'+(th.top?' class="top"':'')+cropStyle(th.crop)+'>':'<span class="ini" aria-hidden="true">'+esc(initial(name))+'</span>')+(tag||'')+'</span>';
}

/* ---------- 렌더 ---------- */
var rq=0;
function schedule(){if(rq)return;rq=requestAnimationFrame(function(){rq=0;renderAll()})}
function renderAll(){
  $('#home').hidden=S.view!=='home';
  $('#detail').hidden=S.view==='home';
  if(S.view==='home'){renderCats(false);renderGrid();renderFoot()}
  else if(!S.editing)renderDetail();
}

function renderCats(force){
  var box=$('#cats'),ae=document.activeElement;
  if(!force&&ae&&box.contains(ae)&&ae.tagName==='INPUT')return;
  var h='<li><button type="button" class="cat all" data-act="filter" data-id="all" aria-current="'+(S.filter==='all')+'">전체</button></li>';
  S.worlds.forEach(function(w){
    if(S.catMode&&S.catMode.type==='edit'&&S.catMode.id===w.id){h+='<li>'+catEditHTML(w)+'</li>';return}
    var cur=S.filter===w.id;
    h+='<li class="cat-row"><button type="button" class="cat" data-act="filter" data-id="'+esc(w.id)+'" aria-current="'+cur+'">'+esc(w.name)+'</button>'+
      (cur&&S.canWrite?'<button type="button" class="cat-tool" data-act="cat-edit" data-id="'+esc(w.id)+'">수정</button>':'')+'</li>';
  });
  if(S.canWrite&&S.ready){
    if(S.catMode&&S.catMode.type==='add'){
      h+='<li><form class="cat-form" data-form="cat-add"><input class="in" id="catNew" maxlength="24" placeholder="카테고리 이름" aria-label="새 카테고리 이름">'+
        '<div class="cat-actions"><button type="submit" class="mini-btn">추가</button><button type="button" class="mini-btn" data-act="cat-cancel">취소</button></div></form></li>';
    }else h+='<li><button type="button" class="cat-add" data-act="cat-add">카테고리 추가</button></li>';
  }
  box.innerHTML=h;
}
function catEditHTML(w){
  if(S.catMode.confirm){
    return '<div class="cat-form"><p class="cat-ask">“'+esc(w.name)+'” 카테고리를 삭제할까요? 안에 있던 캐릭터는 지워지지 않고 전체에 남아요.</p>'+
      '<div class="cat-actions"><button type="button" class="mini-btn danger" data-act="cat-del">삭제</button><button type="button" class="mini-btn" data-act="cat-cancel">취소</button></div></div>';
  }
  return '<form class="cat-form" data-form="cat-edit"><input class="in" id="catRename" maxlength="24" value="'+esc(w.name)+'" aria-label="카테고리 이름">'+
    '<div class="cat-actions"><button type="submit" class="mini-btn">저장</button><button type="button" class="mini-btn danger" data-act="cat-del-ask">삭제</button><button type="button" class="mini-btn" data-act="cat-cancel">취소</button></div></form>';
}
function visibleChars(){
  var q=S.q.trim().toLowerCase();
  return S.chars.filter(function(c){
    if(S.filter!=='all'&&c.worldId!==S.filter)return false;
    if(!q)return true;
    return (c.name+' '+c.keywords.join(' ')+' '+c.intro).toLowerCase().indexOf(q)>=0;
  });
}
function cardHTML(c,ex){
  return '<a class="card" href="#'+(ex?'example':'char-'+esc(c.id))+'">'+sqHTML(thumb(c),c.name,ex?'<span class="tag">예시</span>':'')+
    '<span class="card-txt"><span class="card-name">'+esc(c.name||'이름 없음')+'</span>'+
    (c.keywords.length?'<span class="card-kw">'+c.keywords.map(function(k){return '#'+esc(k)}).join(' ')+'</span>':'')+'</span></a>';
}
function renderGrid(){
  var g=$('#grid');
  if(!S.ready){g.innerHTML='<p class="grid-msg">불러오는 중…</p>';return}
  var h='',list=visibleChars();
  if(!S.chars.length)h+=cardHTML(EX,true);
  else if(!list.length)h+='<p class="grid-msg">'+(S.q.trim()?'“'+esc(S.q.trim())+'”에 맞는 캐릭터가 없어요.':'이 카테고리에는 아직 캐릭터가 없어요.')+'</p>';
  h+=list.map(function(c){return cardHTML(c,false)}).join('');
  if(S.canWrite)h+='<a class="card card-add" href="#new"><span class="sq"><span>+ 캐릭터 추가</span></span></a>';
  g.innerHTML=h;
}
function renderFoot(){
  var note={local:'이 브라우저에만 저장돼요. 다른 기기로 옮길 때는 백업 파일을 쓰세요.',cloud:'내 계정에만 저장돼요. 다른 사람에게는 보이지 않아요.',memory:'저장소를 열 수 없어 새로고침하면 사라져요.'}[S.mode];
  if(!S.canWrite)note='보기 권한이라 저장할 수 없어요.';
  $('#storeNote').textContent=S.ready?note:'불러오는 중…';
  $('#btnExport').hidden=!S.ready||(IN_CLAUDE&&!DL);
  $('#btnImport').hidden=!S.ready||!S.canWrite;
}

/* ---------- 캐릭터 페이지 ---------- */
var TABS=[['profile','프로필'],['setting','설정'],['secret','비밀 설정'],['rel','관계']];
var ROWS=[['age','나이'],['hw','키/몸무게'],['birthday','생일'],['likes','좋아하는 것'],['dislikes','싫어하는 것']];
function current(){if(S.editing)return S.draft;if(S.view==='example')return EX;return findChar(S.viewId)}

function barHTML(ed,ex){
  var left=ed?'<span class="bar-title">'+(S.draft.__new?'새 캐릭터':'편집 중')+'</span>':'<a class="back" href="#">← Character</a>';
  var right='';

/* ---------- 편집 ---------- */
function startEdit(c,isNew){
  var d=JSON.parse(JSON.stringify(c));
  d.kwText=d.keywords.join(', ');
  if(!d.setting){var l=legacySetting(c);if(l)d.setting=l}
  while(d.colors.length<2)d.colors.push(null);
  if(isNew)d.__new=true;
  S.draft=d;S.editing=true;S.delAsk=false;
  renderAll();renderDetail();
}
function cancelEdit(){
  var wasNew=S.draft&&S.draft.__new;
  S.editing=false;S.draft=null;S.delAsk=false;
  if(wasNew)location.replace('#');else renderDetail();
}
async function saveDraft(){
  var d=S.draft,name=String(d.name||'').trim();
  if(!name){toast('캐릭터 이름을 적어 주세요.');var n=$('#eName');if(n)n.focus();return}
  var btn=$('#btnSave');if(btn)btn.disabled=true;
  try{
    var o={};for(var k in d){if(k!=='kwText'&&k!=='__new')o[k]=d[k]}
    o.name=name.slice(0,30);
    o.keywords=parseKw(d.kwText||'');
    ['intro','age','height','weight','birthday','likes','dislikes','setting','secret'].forEach(function(k){o[k]=String(o[k]||'').trim()});
    o.colors=d.colors.filter(function(x){return HEX.test(x||'')});
    o.relations=d.relations.map(function(r){
      var t=r.targetId?findChar(r.targetId):null;
      return {targetId:t?t.id:'',name:String(t?t.name:r.name).trim(),rel:String(r.rel).trim(),note:String(r.note).trim(),image:t?'':String(r.image||'')};
    }).filter(function(r){return r.targetId||r.name});
    ['gender','personality','traits','bio'].forEach(function(k){delete o[k]});
    var now=Date.now();
    if(d.__new)o.createdAt=now;
    o.updatedAt=now;
    var sl=allSlots(o);
    for(var i=0;i<sl.length;i++){
      var v=getSlot(o,sl[i]);
      if(v&&v.indexOf('data:')===0){var id=newId('i');await Store.putImg(id,v);setSlot(o,sl[i],id)}
    }
    var old=findChar(o.id);
    await Store.putChar(normChar(o));
    if(old){var keep=imgIds(o);imgIds(old).forEach(function(id){if(keep.indexOf(id)<0)Store.delImg(id).catch(function(){})})}
    S.editing=false;S.draft=null;S.delAsk=false;
    if(d.__new)location.replace('#char-'+o.id);else renderDetail();
    toast('저장했어요.');
  }catch(e){toast(ERR);if(btn)btn.disabled=false}
}
async function deleteChar(){
  var c=findChar(S.draft&&S.draft.id);if(!c)return;
  try{
    await Store.delChar(c.id);
    imgIds(c).forEach(function(id){Store.delImg(id).catch(function(){})});
    S.editing=false;S.draft=null;S.delAsk=false;
    location.hash='';
    toast('삭제했어요.');
  }catch(e){toast(ERR)}
}
async function delCategory(id){
  S.catMode=null;
  if(S.filter===id)S.filter='all';
  try{await Store.delCat(id)}catch(e){toast(ERR)}
  renderCats(true);renderGrid();
}
function copyColor(c){
  try{navigator.clipboard.writeText(c).then(function(){toast(c+' 를 복사했어요.')},function(){toast('색상 코드: '+c)})}catch(e){toast('색상 코드: '+c)}
}

/* ---------- 이동 ---------- */
function onRoute(){
  var h='';try{h=decodeURIComponent(location.hash.replace(/^#/,''))}catch(e){}
  var prev=S.view+':'+S.viewId;
  ['#lb','#dlgSheet','#dlgImport','#dlgCrop'].forEach(function(s){var dl=$(s);if(dl&&dl.open)closeD(dl)});
  if(S.editing&&!(h==='new'&&S.draft&&S.draft.__new)&&!(h==='char-'+(S.draft&&S.draft.id))){S.editing=false;S.draft=null}
  if(h==='example'){S.view='example';S.viewId=null}
  else if(h.indexOf('char-')===0){S.view='char';S.viewId=h.slice(5)}
  else if(h==='new'){
    S.view='char';S.viewId=null;
    if(S.ready&&S.canWrite&&!S.editing){
      S.tab='profile';
      startEdit(normChar({id:newId('c'),worldId:S.filter!=='all'?S.filter:''}),true);
      window.scrollTo(0,0);return;
    }
  }
  else{S.view='home';S.viewId=null}
  if(prev!==S.view+':'+S.viewId){S.tab='profile';S.delAsk=false;window.scrollTo(0,0)}
  renderAll();
}

/* ---------- 이벤트 ---------- */
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-act]');
  if(!t){if(e.target.tagName==='DIALOG')closeD(e.target);return}
  var a=t.getAttribute('data-act'),d=S.draft;
  if(a==='filter'){S.filter=t.getAttribute('data-id');S.catMode=null;renderCats(true);renderGrid()}
  else if(a==='cat-add'){S.catMode={type:'add'};renderCats(true);$('#catNew').focus()}
  else if(a==='cat-edit'){S.catMode={type:'edit',id:t.getAttribute('data-id')};renderCats(true);var r=$('#catRename');r.focus();r.select()}
  else if(a==='cat-del-ask'){S.catMode.confirm=true;renderCats(true)}
  else if(a==='cat-del'){delCategory(S.catMode.id)}
  else if(a==='cat-cancel'){S.catMode=null;renderCats(true)}
  else if(a==='edit'){var c=current();if(c)startEdit(c,false)}
  else if(a==='cancel')cancelEdit();
  else if(a==='save')saveDraft();
  else if(a==='tab'){S.tab=t.getAttribute('data-tab');renderDetail();var tb=$('#tab-'+S.tab);if(tb)tb.focus()}
  else if(a==='color-add'){d.colors.push(null);renderDetail()}
  else if(a==='color-del'){d.colors.splice(+t.getAttribute('data-i'),1);renderDetail()}
  else if(a==='copy-color')copyColor(t.getAttribute('data-c'));
  else if(a==='pick'){S.pickSlot=t.getAttribute('data-slot');$('#filePick').click()}
  else if(a==='clear-img'){
    var cl=t.getAttribute('data-slot');setSlot(d,cl,'');
    if(cl[0]==='g')d.galleryCrop[+cl.slice(1)]=null;
    renderDetail();
  }
  else if(a==='crop-gal'){
    var gi=+t.getAttribute('data-i'),gs=imgSrc(d.gallery[gi]);
    if(gs)openCrop(gs,function(cr){if(S.editing&&S.draft===d){d.galleryCrop[gi]=cr;renderDetail()}},{rect:true,init:d.galleryCrop[gi],title:'캐 이미지'+(gi+1)+' 보이는 부분 조정'});
  }
  else if(a==='zoom'){var im=t.querySelector('img');if(im){$('#lbImg').src=im.src;openD($('#lb'))}}
  else if(a==='rel-add'){d.relations.push({targetId:'',name:'',rel:'',note:'',image:''});renderDetail();var sel=$('#rt'+(d.relations.length-1));if(sel)sel.focus()}
  else if(a==='rel-del'){d.relations.splice(+t.getAttribute('data-i'),1);renderDetail()}
  else if(a==='del-ask'){S.delAsk=true;renderDetail()}
  else if(a==='del-cancel'){S.delAsk=false;renderDetail()}
  else if(a==='del-do')deleteChar();
  else if(a==='sheet')openSheet();
  else if(a==='crop-full'||a==='crop-again'){
    var cs=imgSrc(a==='crop-full'?d.full:d.image);
    if(cs)openCrop(cs,function(v){if(S.editing&&S.draft===d){d.image=v;renderDetail()}});
  }
  else if(a==='close')closeD(t.closest('dialog'));
});
$('#detail').addEventListener('input',function(e){
  if(!S.editing)return;
  var t=e.target,d=S.draft;
  if(t.hasAttribute('data-f')){d[t.getAttribute('data-f')]=t.value;if(t.tagName==='TEXTAREA')autosize(t);return}
  if(t.hasAttribute('data-rf')){
    var row=t.closest('[data-ri]');if(!row)return;
    var i=+row.getAttribute('data-ri'),f=t.getAttribute('data-rf');
    if(f!=='targetId'){d.relations[i][f]=t.value;if(t.tagName==='TEXTAREA')autosize(t)}
    return;
  }
  if(t.hasAttribute('data-color')){
    var ci=+t.getAttribute('data-color');d.colors[ci]=t.value;
    var lab=t.closest('.sw');lab.style.background=t.value;
    var sp=lab.querySelector('span');if(sp)sp.remove();
  }
});
$('#detail').addEventListener('change',function(e){
  if(!S.editing)return;
  var t=e.target;
  if(t.getAttribute('data-rf')==='targetId'){
    var i=+t.closest('[data-ri]').getAttribute('data-ri'),o=findChar(t.value);
    S.draft.relations[i].targetId=t.value;
    S.draft.relations[i].name=o?o.name:'';
    renderDetail();
  }
});
$('#detail').addEventListener('keydown',function(e){
  var t=e.target;if(!t.classList||!t.classList.contains('tab'))return;
  var k=e.key,idx=TABS.findIndex(function(x){return x[0]===S.tab});

/* ---------- 1:1 이미지 자르기 ---------- */
var CROP={im:null,s:1,min:1,x:0,y:0,V:0,cb:null,pts:{},pinch:null};
function cropApply(){
  var C=CROP,iw=C.im.naturalWidth||C.im.width,ih=C.im.naturalHeight||C.im.height;
  C.s=Math.max(C.min,Math.min(C.min*6,C.s));
  C.x=Math.min(0,Math.max(C.V-iw*C.s,C.x));
  C.y=Math.min(0,Math.max(C.V-ih*C.s,C.y));
  $('#cropImg').style.transform='translate('+C.x+'px,'+C.y+'px) scale('+C.s+')';
  $('#cropZoom').value=String(C.s/C.min);
}
function cropZoomTo(ns,cx,cy){
  var C=CROP;if(cx==null){cx=C.V/2;cy=C.V/2}
  ns=Math.max(C.min,Math.min(C.min*6,ns));
  C.x=cx-(cx-C.x)*ns/C.s;C.y=cy-(cy-C.y)*ns/C.s;C.s=ns;
  cropApply();
}
async function openCrop(src,cb,opt){
  opt=opt||{};
  var im;try{im=await loadImg(src)}catch(e){toast('이미지를 불러오지 못했어요.');return}
  var iw=im.naturalWidth||im.width,ih=im.naturalHeight||im.height;
  CROP.im=im;CROP.cb=cb;CROP.pts={};CROP.pinch=null;CROP.rect=!!opt.rect;
  $('#cropTitle').textContent=opt.title||'프로필 이미지 자르기';
  $('#cropHint').textContent='이미지를 끌어서 위치를 옮기고, 아래 막대나 마우스 휠, 두 손가락으로 크기를 조절하세요.'+
    (opt.rect?' 원본은 그대로 남아서 크게 보기에서는 전체가 보여요.':'');
  var img=$('#cropImg');img.src=src;img.style.width=iw+'px';img.style.height=ih+'px';
  openD($('#dlgCrop'));
  var V=$('#cropStage').clientWidth||300;
  CROP.V=V;CROP.min=Math.max(V/iw,V/ih);CROP.s=CROP.min;
  /* 세로로 긴 그림(스탠딩)은 얼굴이 있는 윗부분부터 보여 줘요 */
  CROP.x=(V-iw*CROP.s)/2;CROP.y=ih>iw?0:(V-ih*CROP.s)/2;
  var ic=normCrop(opt.init);
  if(ic){CROP.s=V/(ic.sz*iw);CROP.x=-ic.l*iw*CROP.s;CROP.y=-ic.t*ih*CROP.s}
  cropApply();
}
(function(){
  var st=$('#cropStage');
  st.addEventListener('pointerdown',function(e){try{st.setPointerCapture(e.pointerId)}catch(err){}CROP.pts[e.pointerId]={x:e.clientX,y:e.clientY};CROP.pinch=null});
  st.addEventListener('pointermove',function(e){
    var p=CROP.pts[e.pointerId];if(!p||!CROP.im)return;
    var ids=Object.keys(CROP.pts);
    if(ids.length===1){CROP.x+=e.clientX-p.x;CROP.y+=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;cropApply();return}
    p.x=e.clientX;p.y=e.clientY;
    var a=CROP.pts[ids[0]],b=CROP.pts[ids[1]],dd=Math.hypot(a.x-b.x,a.y-b.y),r=st.getBoundingClientRect();
    if(CROP.pinch)cropZoomTo(CROP.s*dd/CROP.pinch,(a.x+b.x)/2-r.left,(a.y+b.y)/2-r.top);
    CROP.pinch=dd;
  });
  var up=function(e){delete CROP.pts[e.pointerId];CROP.pinch=null};
  st.addEventListener('pointerup',up);st.addEventListener('pointercancel',up);
  st.addEventListener('wheel',function(e){
    if(!CROP.im)return;e.preventDefault();
    var r=st.getBoundingClientRect();cropZoomTo(CROP.s*Math.exp(-e.deltaY*0.0015),e.clientX-r.left,e.clientY-r.top);
  },{passive:false});
  st.addEventListener('keydown',function(e){
    if(!CROP.im)return;
    var k=e.key,m={ArrowLeft:[12,0],ArrowRight:[-12,0],ArrowUp:[0,12],ArrowDown:[0,-12]}[k];
    if(m){e.preventDefault();CROP.x+=m[0];CROP.y+=m[1];cropApply()}
    else if(k==='+'||k==='='){e.preventDefault();cropZoomTo(CROP.s*1.1)}
    else if(k==='-'){e.preventDefault();cropZoomTo(CROP.s/1.1)}
  });
  $('#cropZoom').addEventListener('input',function(){if(CROP.im)cropZoomTo(CROP.min*Number(this.value))});
  window.addEventListener('resize',function(){
    if(!$('#dlgCrop').open||!CROP.im)return;
    var nv=st.clientWidth;if(!nv||nv===CROP.V)return;
    var k=nv/CROP.V;CROP.x*=k;CROP.y*=k;CROP.s*=k;CROP.min*=k;CROP.V=nv;cropApply();
  });
  $('#cropOk').addEventListener('click',async function(){
    var C=CROP;if(!C.im)return;
    var sw=C.V/C.s,sx=-C.x/C.s,sy=-C.y/C.s,out=Math.max(1,Math.min(800,Math.round(sw)));
    if(C.rect){
      var ciw=C.im.naturalWidth||C.im.width,cih=C.im.naturalHeight||C.im.height;
      closeD($('#dlgCrop'));
      if(C.cb)C.cb({l:sx/ciw,t:sy/cih,sz:sw/ciw,r:cih/ciw});
      return;
    }
    var cv=document.createElement('canvas');cv.width=cv.height=out;
    cv.getContext('2d').drawImage(C.im,sx,sy,sw,sw,0,0,out,out);
    var btn=this;btn.disabled=true;
    try{
      var d=await encode(cv.toDataURL('image/png'),800,S.mode==='cloud'?CLOUD_IMG:SPEC.image.budget);
      closeD($('#dlgCrop'));if(C.cb)C.cb(d);
    }catch(e){toast('이미지를 만들지 못했어요. 다시 시도해 주세요.')}
    btn.disabled=false;
  });
})();

var SHEET={c:null,blob:null,url:'',busy:0};
function wrapText(x,text,maxW){
  var lines=[];
  String(text).split('\n').forEach(function(par){
    var line='';
    par.split(/(\s+)/).forEach(function(w){
      if(!w)return;
      if(x.measureText(line+w).width<=maxW){line+=w;return}
      if(/^\s+$/.test(w)){lines.push(line);line='';return}
      if(line.trim()){lines.push(line.replace(/\s+$/,''));line=''}
      if(x.measureText(w).width<=maxW){line=w;return}
      Array.from(w).forEach(function(ch){if(line&&x.measureText(line+ch).width>maxW){lines.push(line);line=''}line+=ch});
    });
    lines.push(line.replace(/\s+$/,''));
  });
  return lines;
}
function coverDraw(x,im,dx,dy,s,top){
  var iw=im.naturalWidth||im.width,ih=im.naturalHeight||im.height,side=Math.min(iw,ih);
  x.drawImage(im,(iw-side)/2,top?0:(ih-side)/2,side,side,dx,dy,s,s);
}

      });

    if(c.intro)y=para(c.intro,RX,y+12,RW,'400',26,38);
    var section=function(s){y+=64;font('700',30);text(s,RX,y);y+=46;if(!dry){x.fillStyle='#E3E3E3';x.fillRect(RX,y,RW,2)}y+=28};
    if(opt.profile){

      var ny=para(v||'-',RX+220,y,RW-220,'500',22,34,v?'#111111':'#BDBDBD');

    if(galIm.length){

        var dx=RX+i*(s+gap);
        if(gm.cr){var iw2=gm.im.naturalWidth||gm.im.width,ih2=gm.im.naturalHeight||gm.im.height;x.drawImage(gm.im,gm.cr.l*iw2,gm.cr.t*ih2,gm.cr.sz*iw2,gm.cr.sz*iw2,dx,y,s,s)}
        else coverDraw(x,gm.im,dx,y,s,false);
      });
      y+=s;
    }
    }
    if(opt.setting&&setting){section('설정');y=para(setting,RX,y,RW,'400',22,37)}

    for(var c=0;c<oi.length;c++)await Store.delImg(oi[c]);
  }
  var imgs=d.images&&typeof d.images==='object'?d.images:{};
  var ids=Object.keys(imgs);
  for(var i=0;i<ids.length;i++){if(ID_OK.test(ids[i])&&okImg(imgs[ids[i]]))await Store.putImg(ids[i],imgs[ids[i]])}
  for(var j=0;j<d.worlds.length;j++){
    var w=d.worlds[j];if(!w||!ID_OK.test(String(w.id||'')))continue;
    await Store.putCat({id:String(w.id),name:String(w.name||'이름 없음').slice(0,24),order:Number(w.order)||j});
  }
  for(var k=0;k<d.chars.length;k++){
    var ch=d.chars[k];if(!ch||!ID_OK.test(String(ch.id||'')))continue;
    var n=normChar(ch);n.id=String(ch.id);n.name=(n.name||'이름 없음').slice(0,30);
    allSlots(n).forEach(function(s){var v=getSlot(n,s);if(v&&v.indexOf('data:')===0&&!okImg(v))setSlot(n,s,'')});
    await Store.putChar(n);
  }
  schedule();
}

/* ---------- 시작 ---------- */
async function initLocal(){
  try{IDB=await idbOpen()}catch(e){IDB=null}
  if(!IDB){S.mode='memory';return}
  S.mode='local';
  S.worlds=((await idbRun('worlds','readonly',function(s){return s.getAll()}))||[]).sort(cmpW);
  S.chars=((await idbRun('chars','readonly',function(s){return s.getAll()}))||[]).map(normChar).sort(cmpC);
  ((await idbRun('images','readonly',function(s){return s.getAll()}))||[]).forEach(function(r){if(r&&okImg(r.data))S.img[r.id]=r.data});
  try{
    if(!S.worlds.length&&!S.chars.length&&!localStorage.getItem('oc-archive-migrated-v1')){
      var j=JSON.parse(localStorage.getItem('oc-archive-v1')||'null');
      if(j){
        for(var a=0;a<(j.worlds||[]).length;a++)await Store.putCat(j.worlds[a]);
        for(var b=0;b<(j.chars||[]).length;b++)await Store.putChar(normChar(j.chars[b]));
      }
      localStorage.setItem('oc-archive-migrated-v1','1');
    }
  }catch(e){}
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
}
function initCloud(db,uid){
  return new Promise(function(res){
    CLOUD=db.doc('data/users/'+uid+'/profile');S.mode='cloud';
    var got={w:0,c:0},done=false;
    var check=function(){if(!done&&got.w&&got.c){done=true;res()}};
    var fail=function(){toast('저장소 연결이 끊겼어요. 페이지를 새로고침해 주세요.')};
    CLOUD.collection('worlds').onSnapshot(function(s){
      S.worlds=s.docs.map(function(d){var o=Object.assign({},d.data());o.id=d.id;return o}).sort(cmpW);got.w=1;check();schedule();
    },fail);
    CLOUD.collection('characters').onSnapshot(function(s){
      S.chars=s.docs.map(function(d){var o=Object.assign({},d.data());o.id=d.id;return normChar(o)}).sort(cmpC);got.c=1;check();schedule();
    },fail);
    CLOUD.collection('images').onSnapshot(function(s){
      var m={};s.docs.forEach(function(d){var x=d.data();if(x&&okImg(x.data))m[d.id]=x.data});
      S.img=Object.assign({},S.img,m);schedule();
    },fail);
  });
}
async function boot(){
  onRoute();
  var db=null,user=null,uid=null;
  if(IN_CLAUDE){try{var r=await Promise.all([window.claude.use('db'),window.claude.use('user'),window.claude.use('downloads')]);db=r[0];user=r[1];DL=r[2]}catch(e){}}
  if(user){
    try{uid=await user.id()}catch(e){}
    try{if((await user.can('data.write'))===false)S.canWrite=false}catch(e){}
  }
  if(db&&uid)await initCloud(db,uid);
  else await initLocal();
  S.ready=true;
  onRoute();
  renderAll();
}
window.addEventListener('hashchange',onRoute);
boot();
})();
